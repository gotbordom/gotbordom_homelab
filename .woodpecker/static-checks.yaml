when:
  branch: ${CI_REPO_DEFAULT_BRANCH}

steps:
  # TODO DRY with nix develop and custom entrypoint https://github.com/woodpecker-ci/woodpecker/pull/2985,
  # but first we need a Nix cache. See the nix-cache branch for the WIP.
  tools-versions:
    image: nixos/nix
    commands:
      - echo 'experimental-features = flakes nix-command' >> /etc/nix/nix.conf
      # - echo 'trusted-substituters = http://nix-cache.nix-cache' >> /etc/nix/nix.conf
      # - echo 'substituters = http://nix-cache.nix-cache' >> /etc/nix/nix.conf
      - nix develop --command make -C test filter=ToolsVersions
    when:
      - event: pull_request
        path:
          include:
            - 'flake.*'
    depends_on: []
  pre-commit:
    image: nixery.dev/shell/git/pre-commit # TODO replace with nix develop
    commands:
      - pre-commit run --color=always
    when:
      - event: pull_request
    depends_on: []
  inventory-consistency:
    image: nixos/nix
    commands:
      - echo 'experimental-features = flakes nix-command' >> /etc/nix/nix.conf
      - nix develop --command make -C test filter=TestInventorySubnetConsistency
    when:
      - event: pull_request
        path:
          include:
            - 'metal/inventories/*.yml'
    depends_on: []
  storage-replication-consistency:
    image: nixos/nix
    commands:
      - echo 'experimental-features = flakes nix-command' >> /etc/nix/nix.conf
      - nix develop --command make -C test filter=TestCeph
    when:
      - event: pull_request
        path:
          include:
            - 'metal/inventories/prod.yml'
            - 'system/rook-ceph/values.yaml'
    depends_on: []
  permission-tiers:
    image: nixos/nix
    commands:
      - echo 'experimental-features = flakes nix-command' >> /etc/nix/nix.conf
      - nix develop --command make -C test filter='TestGrafanaRoleMappingConfigured|TestKanidmPermissionTiersDefined'
    when:
      - event: pull_request
        path:
          include:
            - 'platform/grafana/values.yaml'
            - 'scripts/hacks'
    depends_on: []
  gpu-node-selector-consistency:
    image: nixos/nix
    commands:
      - echo 'experimental-features = flakes nix-command' >> /etc/nix/nix.conf
      - nix develop --command make -C test filter=TestGPUNodeSelectorConsistency
    when:
      - event: pull_request
        path:
          include:
            - 'metal/roles/k3s/templates/config.yaml.j2'
            - 'system/nvidia-device-plugin/values.yaml'
            - 'apps/ollama/values.yaml'
            - 'apps/jupyter/values.yaml'
    depends_on: []
