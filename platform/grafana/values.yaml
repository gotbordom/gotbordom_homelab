grafana:
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - &host grafana.elluv.io
    tls:
      - secretName: grafana-general-tls
        hosts:
          - *host
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: monitoring-system
    datasources:
      enabled: true
      searchNamespace: monitoring-system
  envFromSecret: grafana-secrets
  grafana.ini:
    server:
      root_url: https://grafana.elluv.io
    auth.generic_oauth:
      enabled: true
      allow_sign_up: true
      name: Dex
      client_id: grafana-sso
      client_secret: $__env{GRAFANA_SSO_CLIENT_SECRET}
      scopes: openid profile email groups
      auth_url: https://dex.elluv.io/auth
      token_url: https://dex.elluv.io/token
      api_url: https://dex.elluv.io/userinfo
      # Maps the Kanidm group carried in the OIDC "groups" claim to a Grafana
      # org role. Anyone not in admin or editor falls through to Viewer rather
      # than being denied -- being in the viewer group (or any group at all,
      # once Kanidm's scope-map grants it login) is enough to read dashboards.
      # Kanidm reports groups as SPNs (admin@auth.elluv.io) by default, or as
      # short names with prefer-short-username -- accept either.
      role_attribute_path: "(contains(groups[*], 'admin') || contains(groups[*], 'admin@auth.elluv.io')) && 'Admin' || (contains(groups[*], 'editor') || contains(groups[*], 'editor@auth.elluv.io')) && 'Editor' || 'Viewer'"
