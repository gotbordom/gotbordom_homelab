all:
  vars:
    # Single source of truth for the kube-vip "parking" addresses (control-plane
    # VIP + LB pool): everything below derives from this one prefix, so it can't
    # drift out of sync with the host subnet again. Picked .239/.240-255 as an
    # assumed-free high range -- if it collides with your router's DHCP pool,
    # change metal_subnet_prefix (or the offsets below) and nothing else.
    metal_subnet_prefix: 192.168.0
    control_plane_endpoint: "{{ metal_subnet_prefix }}.239"
    load_balancer_ip_pool:
      - "{{ metal_subnet_prefix }}.240/28"
# network_interface is the wired NIC's MAC rather than a kernel name (eno1,
# enp0s31f6, ...): Anaconda's `network --device` accepts either, and the MAC
# is already known from the BIOS so there's nothing to guess. A name that
# doesn't exist on the box is silently ignored and the node falls back to DHCP.
# disk must match the real device -- NVMe drives are nvme0n1, not sda.
metal:
  children:
    masters:
      hosts:
        thinkcenter0: {ansible_host: 192.168.0.9, mac: '00:23:24:af:ef:30', disk: sda, network_interface: '00:23:24:af:ef:30'}
    workers:
      hosts:
        hpz3: {ansible_host: 192.168.0.12, mac: '9c:7b:ef:40:f3:64', disk: nvme0n1, network_interface: '9c:7b:ef:40:f3:64'}
        # optiplex0 commented out until its BIOS gets the same fix as hpz3
        # (UEFI-only, network boot first). Ceph stays at size 1 and kured
        # stays removed until it joins -- see system/rook-ceph/values.yaml
        # and the removed system/kured; revert those to multi-node settings
        # when re-enabling it.
        # optiplex0: {ansible_host: 192.168.0.13, mac: '54:bf:64:a3:e4:b2', disk: sda, network_interface: '54:bf:64:a3:e4:b2'}
    # Cross-cutting group (not mutually exclusive with masters/workers): any
    # node with a usable GPU goes here, so GPU driver/runtime setup and k3s
    # node labeling only ever target nodes that actually have one. Add or
    # remove hosts here independently of whether they're a master or worker.
    gpu:
      hosts:
        hpz3:
