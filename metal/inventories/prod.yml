all:
  vars:
    # NOTE: picked .239/.240-255 as an assumed-free high range on the 192.168.0.0/24
    # segment -- please confirm these don't collide with your router's DHCP pool
    # before running `make metal`.
    control_plane_endpoint: 192.168.0.239
    load_balancer_ip_pool:
      - 192.168.0.240/28
metal:
  children:
    masters:
      hosts:
        thinkcenter0: {ansible_host: 192.168.0.9, mac: '00:23:24:af:ef:30', disk: sda, network_interface: wlp1s0}
    workers:
      hosts:
        hpz3: {ansible_host: 192.168.0.12, mac: '9c:7b:ef:40:f3:64', disk: sda, network_interface: wlp1s0}
        # optiplex0: disk is sda or nvme? working tree has disagreed with itself across
        # recent edits -- confirm the real device before uncommenting, a wrong guess
        # here wipes the wrong disk.
        # optiplex0: {ansible_host: 192.168.0.13, mac: '54:bf:64:a3:e4:b2', disk: nvme, network_interface: wlp1s0}
