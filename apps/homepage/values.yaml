app-template:
  controllers:
    main:
      containers:
        main:
          image:
            repository: ghcr.io/gethomepage/homepage
            tag: v0.8.8
  service:
    main:
      ports:
        http:
          port: 3000
          protocol: HTTP
  ingress:
    main:
      enabled: true
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - host: &host home.elluv.io
          paths:
            - path: /
              pathType: Prefix
              service:
                name: main
                port: http
      tls:
        - hosts:
            - *host
          secretName: homepage-tls-certificate
  persistence:
    config:
      enabled: true
      type: configMap
      name: homepage-config
      globalMounts:
        - path: /app/config/settings.yaml
          subPath: settings.yaml
        - path: /app/config/widgets.yaml
          subPath: widgets.yaml
        - path: /app/config/services.yaml
          subPath: services.yaml
        - path: /app/config/bookmarks.yaml
          subPath: bookmarks.yaml
  configMaps:
    config:
      enabled: true
      data:
        settings.yaml: |
          background: https://images.unsplash.com/photo-1502790671504-542ad42d5189?auto=format&fit=crop&w=2560&q=80
          cardBlur: md
          theme: dark
          headerStyle: boxed
          hideVersion: true
        widgets.yaml: |
          - search:
              provider: google
              target: _blank
        services.yaml: |
          - Popular:
            - Jellyfin:
                href: https://jellyfin.elluv.io
                description: Media system (movies, music, etc.)
                icon: jellyfin.svg
            - Jellyseerr:
                href: https://jellyseerr.elluv.io
                description: Request media
                icon: jellyseerr.svg
          - Management:
            - Transmission:
                href: https://transmission.elluv.io
                description: Bittorrent client
                icon: transmission.svg
            - Prowlarr:
                href: https://prowlarr.elluv.io
                description: Indexer manager
                icon: prowlarr.svg
            - Radarr:
                href: https://radarr.elluv.io
                description: Movie manager
                icon: radarr.svg
            - Sonarr:
                href: https://sonarr.elluv.io
                description: TV show manager
                icon: sonarr.svg
            - Kanidm:
                href: https://auth.elluv.io
                description: Identity management
                icon: https://auth.elluv.io/pkg/img/logo-square.svg
          - Development:
            - ArgoCD:
                href: https://argocd.elluv.io
                description: Continuous deployment
                icon: argocd.svg
            - Grafana:
                href: https://grafana.elluv.io
                description: Observability dashboards
                icon: grafana.svg
          - Utilities:
            - Speedtest:
                href: https://speedtest.elluv.io
                description: Internal network speed test
                icon: openspeedtest.png
        bookmarks.yaml: |
          - Homelab:
            - Documentation:
              - href: https://github.com/gotbordom/gotbordom_homelab/tree/master/docs
                icon: google-docs.svg
            - Homelab repository:
              - href: https://github.com/gotbordom/gotbordom_homelab
                icon: github.svg
          - Managed services:
            - Cloudflare:
              - href: https://dash.cloudflare.com
                icon: cloudflare.svg
            - Tailscale:
              - href: https://login.tailscale.com/admin
                icon: tailscale.svg
            - Backblaze B2:
              - href: https://secure.backblaze.com/b2_buckets.htm
                icon: backblaze.svg
          - Infrastructure:
            - Router:
              - href: http://192.168.0.1
                icon: router.svg
