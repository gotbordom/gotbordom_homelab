app-template:
  controllers:
    main:
      pod:
        # Only hpz3 carries the k3s "gpu=true" node-label (see
        # metal/roles/k3s/templates/config.yaml.j2) and the Nvidia
        # container runtime (see metal/roles/gpu and
        # system/nvidia-device-plugin) -- without both, requesting
        # nvidia.com/gpu below would just leave this pod Pending forever.
        runtimeClassName: nvidia
        nodeSelector:
          gpu: "true"
      containers:
        main:
          image:
            repository: docker.io/ollama/ollama
            tag: 0.1.29
          resources:
            limits:
              nvidia.com/gpu: 1
    ui:
      containers:
        main:
          image:
            repository: ghcr.io/open-webui/open-webui
            tag: latest
          env:
            OLLAMA_BASE_URL: http://ollama:11434
  service:
    main:
      ports:
        http:
          port: 11434
          protocol: HTTP
    ui:
      controller: ui
      ports:
        http:
          port: 8080
          protocol: HTTP
  ingress:
    main:
      enabled: true
      className: nginx
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
      hosts:
        - host: &ollamaHost ollama.elluv.io
          paths:
            - path: /
              pathType: Prefix
              service:
                name: main
                port: http
        - host: &uiHost ai.elluv.io
          paths:
            - path: /
              pathType: Prefix
              service:
                name: ui
                port: http
      tls:
        - hosts:
            - *ollamaHost
            - *uiHost
          secretName: ollama-tls-certificate
  persistence:
    data:
      accessMode: ReadWriteOnce
      size: 10Gi
      advancedMounts:
        main:
          main:
            - path: /root/.ollama
