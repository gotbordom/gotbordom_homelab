apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: jupyter-secrets
  namespace: {{ .Release.Namespace }}
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: global-secrets
  target:
    name: jupyter-secrets
  data:
    - secretKey: JUPYTER_TOKEN
      remoteRef:
        key: jupyter.admin
        property: JUPYTER_TOKEN
